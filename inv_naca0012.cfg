% ------------- DIRECT, ADJOINT, AND LINEARIZED PROBLEM DEFINITION ------------%
SOLVER= INC_EULER
MATH_PROBLEM= DIRECT
KIND_TURB_MODEL= NONE

% -------------------- INCOMPRESSIBLE FREE-STREAM DEFINITION --------------------%
INC_DENSITY_INIT= 998.2
INC_VELOCITY_INIT= ( 1.775, 0.0, 0.0 )

% ---------------------- BOUNDARY CONDITION DEFINITION -------------------------%
MARKER_EULER= ( airfoil, lower_wall, upper_wall )
MARKER_INLET= ( inlet, 0.0, 1.775, 1.0, 0.0, 0.0 )
MARKER_OUTLET= ( outlet, 0.0 )
INC_INLET_TYPE= VELOCITY_INLET
INC_OUTLET_TYPE= PRESSURE_OUTLET

% ---------------------- NUMERICAL METHOD DEFINITION ---------------------------%
CFL_NUMBER= 100.0
CFL_ADAPT= NO
RK_ALPHA_COEFF= ( 0.66667, 0.66667, 1.0 )
CONV_NUM_METHOD_FLOW= JST
SLOPE_LIMITER_FLOW= VENKATAKRISHNAN
VENKAT_LIMITER_COEFF= 0.05

% ------------------------ LINEAR SOLVER DEFINITION ----------------------------%
LINEAR_SOLVER= FGMRES
LINEAR_SOLVER_PREC= ILU
LINEAR_SOLVER_ERROR= 1E-6
LINEAR_SOLVER_ITER= 10

% ------------------------ ITERATION AND CONVERGENCE PARAMETERS -----------------%
% For unsteady simulation, ITER becomes the number of inner iterations per time step
INNER_ITER= 500
CONV_RESIDUAL_MINVAL= 1e-8

% ============================================================================ %
% CORRECT UNSTEADY SIMULATION SETTINGS
% ============================================================================ %
% Enable time domain simulation
TIME_DOMAIN= YES

% Time marching method (TIME_STEPPING, DUAL_TIME_STEPPING-1ST_ORDER, DUAL_TIME_STEPPING-2ND_ORDER)
TIME_MARCHING= TIME_STEPPING

% Physical time step (seconds)
TIME_STEP= 0.005

% Total number of time steps
TIME_ITER= 500

% Set UNST_CFL_NUMBER to 0 to use fixed TIME_STEP (recommended)
UNST_CFL_NUMBER= 0.0

% ----------------------------- INPUT/OUTPUT -----------------------------------%
MESH_FILENAME= mesh_NACA0012_5deg_6814.su2
SOLUTION_FILENAME= solution_flow.dat
RESTART_FILENAME= restart_flow.dat
VOLUME_FILENAME= volume_flow
SURFACE_FILENAME= surface_flow
TABULAR_FORMAT= TECPLOT

% Output frequency (save every 10 time steps)
OUTPUT_WRT_FREQ= 10

% Request surface CSV output
OUTPUT_FILES= (RESTART, CSV, PARAVIEW, SURFACE_PARAVIEW, SURFACE_CSV)

% Define which surfaces to monitor and output
MARKER_PLOTTING= ( airfoil, lower_wall, upper_wall )
                                                                                                                      
